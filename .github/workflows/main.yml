# The name displayed in the GitHub Actions tab
name: Compile, Build and Publish Package

# The Trigger: Run this workflow every time someone pushes to the any branch
on:
  push:
    branches: ["main"]

# What to do
jobs:
  # Job: Compile the package on Main Branch
  compile-package:
    uses: ./.github/workflows/compile.yml

  # Job: Build the package on Main Branch
  build-package:
    uses: ./.github/workflows/build-main.yml
    needs: compile-package

  # Job: Publish the package to Marketplace
  publish-package-to-marketplace:
    uses: ./.github/workflows/publish.yml
    needs: build-package
