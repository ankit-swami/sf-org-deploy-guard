# The name displayed in the GitHub Actions tab
name: GitHub Actions Test

# The Trigger: Run this workflow every time someone pushes to the any branch
on:
  push:
    branches:
      - '**'

# What to do
jobs:
  # First job: Say hello test job
  say-hello-job:
    # The Runner: Use the latest Ubuntu virtual machine
    runs-on: ubuntu-latest

    # The Steps: The actual actions to execute
    steps:
      # Step A: Check out your repository code onto the runner
      - name: Check out repository code
        uses: actions/checkout@v6

      # Step B: Run a simple shell command
      - name: Run a one-line script
        run: echo "Hello, world! Your first GitHub Action is working."
    
  # Second job: compile the package
  compile-package:
    runs-on: ubuntu-latest

    steps:
      # Step A: Check out your repository code onto the runner
      - name: Check out repository code
        uses: actions/checkout@v6

      # - name: Install dependencies
        # run: npm ci

      - name: Compile the package
        run: npm run compile
