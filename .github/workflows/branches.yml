# The name displayed in the GitHub Actions tab
name: Compile and Build Package

# The Trigger: Run this workflow every time someone pushes to the any branch
on:
  push:
    branches: ["main"]

# What to do
jobs:
  # Job: Compile the package on Feature Branch
  compile-package:
    uses: ./.github/workflows/compile.yml

  # Job: Build the package on Feature Branch
  build-package:
    uses: ./.github/workflows/build-feature.yml
    needs: compile-package
